<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
:root{
  --bg:#F1F4F1; --card:#FFFFFF; --ink:#16211D; --muted:#66716B; --faint:#98A29C;
  --line:#E4E9E3; --brand:#0F5A4A; --brand-2:#0B3F34;
  --pos:#1C8A66; --pos-soft:#E3F2EB; --neg:#BF4E3D; --neg-soft:#F8E8E4;
  --warn:#B9820F; --warn-soft:#FAF0D7; --radius:14px; --soft:#F4F7F4;
  --shadow:0 1px 2px rgba(16,40,33,.04), 0 6px 20px rgba(16,40,33,.05);
}
body.dark{
  --bg:#10161A; --card:#18211D; --ink:#E9EEEB; --muted:#93A09A; --faint:#66746D;
  --line:#28322D; --brand:#2FA083; --brand-2:#227A63;
  --pos:#3BBF93; --pos-soft:#123028; --neg:#E27461; --neg-soft:#39211C;
  --warn:#D69A2E; --warn-soft:#332E1C; --soft:#141C18;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.4);
}
body.dark .auth-wrap{background:linear-gradient(165deg,#16221D 0%,var(--bg) 55%);}
body.dark .auth-logo{background:#fff;}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);font-family:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;}
.app{display:flex;min-height:100vh;}
.sidebar{width:236px;flex-shrink:0;position:sticky;top:0;height:100vh;align-self:flex-start;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;gap:5px;}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 18px;cursor:pointer;border:none;background:none;text-align:left;width:100%;}
.brand-badge{width:36px;height:36px;border-radius:11px;background:var(--brand);color:#fff;display:grid;place-items:center;flex-shrink:0;}
.brand-badge.logo{background:#fff;border:1px solid var(--line);padding:0;overflow:hidden;}
.brand-badge.logo img{width:100%;height:100%;object-fit:contain;}
.inv-logo{max-width:150px;max-height:120px;object-fit:contain;display:block;}
.brand-name{font-family:'Space Grotesk';font-weight:700;font-size:16px;line-height:1.15;color:var(--ink);text-align:center;}
.brand-sub{font-size:11px;color:var(--faint);margin-top:2px;text-align:center;}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:500;font-size:14.5px;cursor:pointer;border:none;background:none;text-align:left;width:100%;transition:background .12s,color .12s;}
.nav-item:hover{background:var(--soft);color:var(--ink);}
.nav-item.active{background:var(--pos-soft);color:var(--brand);font-weight:600;}
.nav-spacer{flex:1;}
.nav-foot{font-size:11px;color:var(--faint);padding:10px 12px;line-height:1.45;}
.bottomnav{display:none;}
.mobilebar{display:none;}
.main{flex:1;min-width:0;padding:26px 30px 44px;max-width:1120px;}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
.page-title{font-family:'Space Grotesk';font-weight:700;font-size:26px;letter-spacing:-.02em;margin:0;}
.page-sub{color:var(--muted);font-size:13.5px;margin-top:3px;}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;}
.btn{font-family:'IBM Plex Sans';font-weight:600;font-size:14px;padding:10px 15px;border-radius:10px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:filter .12s,background .12s,border-color .12s;}
.btn:disabled{opacity:.6;cursor:default;}
.btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}
.btn-primary{background:var(--brand);color:#fff;}
.btn-primary:hover{background:var(--brand-2);}
.btn-ghost{background:var(--card);color:var(--ink);border-color:var(--line);}
.btn-ghost:hover{background:var(--soft);}
.btn-danger{background:var(--neg);color:#fff;}
.btn-danger:hover{filter:brightness(.94);}
.btn-sm{padding:7px 11px;font-size:13px;border-radius:9px;}
.btn-block{width:100%;justify-content:center;padding:12px;}
.icon-btn{background:none;border:1px solid var(--line);border-radius:9px;padding:7px;cursor:pointer;color:var(--muted);display:grid;place-items:center;transition:.12s;}
.icon-btn:hover{color:var(--ink);background:var(--soft);}
.icon-btn.danger:hover{color:var(--neg);border-color:var(--neg);background:var(--neg-soft);}
.icon-btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:14px;margin-bottom:16px;}
.kpi{padding:16px 16px 15px;}
.kpi-label{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);display:flex;align-items:center;gap:6px;}
.kpi-value{font-family:'Space Grotesk';font-weight:700;font-size:22px;margin-top:9px;letter-spacing:-.01em;}
.kpi-value.pos{color:var(--pos);} .kpi-value.neg{color:var(--neg);} .kpi-value.warn{color:var(--warn);}
.kpi-foot{font-size:12px;color:var(--muted);margin-top:5px;}
.hero{padding:22px 22px 20px;margin-bottom:16px;}
.hero-label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);}
.hero-value{font-family:'Space Grotesk';font-weight:700;font-size:40px;letter-spacing:-.02em;margin:6px 0 2px;}
.hero-value.pos{color:var(--pos);} .hero-value.neg{color:var(--neg);}
.hero-note{font-size:13px;color:var(--muted);}
.ledger{margin-top:18px;border-top:1px dashed var(--line);padding-top:8px;}
.ledger-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:14px;gap:12px;}
.ledger-row .lbl{color:var(--muted);font-weight:500;}
.ledger-row .amt{font-family:'Space Grotesk';font-weight:600;white-space:nowrap;}
.amt.pos{color:var(--pos);} .amt.neg{color:var(--neg);}
.section{margin-top:6px;margin-bottom:16px;}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px;}
.section-title{font-family:'Space Grotesk';font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;}
.section-title .muted{color:var(--faint);font-weight:500;}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
.list{display:flex;flex-direction:column;overflow:hidden;}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);}
.row:last-child{border-bottom:none;}
.row-main{flex:1;min-width:0;}
.row-title{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row-meta{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.row-amt{font-family:'Space Grotesk';font-weight:600;font-size:15px;text-align:right;white-space:nowrap;}
.row-actions{display:flex;gap:6px;flex-shrink:0;}
.tiny-muted{font-size:12px;color:var(--faint);}
.chip{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap;}
.chip.pos{background:var(--pos-soft);color:var(--pos);}
.chip.neg{background:var(--neg-soft);color:var(--neg);}
.chip.warn{background:var(--warn-soft);color:var(--warn);}
.bar-row{display:flex;align-items:center;gap:12px;padding:8px 0;}
.bar-name{width:120px;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0;}
.bar-track{flex:1;height:9px;background:var(--soft);border-radius:999px;overflow:hidden;}
.bar-fill{height:100%;background:var(--brand);border-radius:999px;}
.bar-val{font-family:'Space Grotesk';font-weight:600;font-size:13px;width:92px;text-align:right;flex-shrink:0;}
.mchart-bars{display:flex;align-items:flex-end;gap:14px;height:180px;padding:6px 4px 0;}
.mchart-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;min-width:0;}
.mchart-pair{display:flex;align-items:flex-end;gap:4px;height:100%;width:100%;justify-content:center;}
.mchart-bar{width:16px;border-radius:4px 4px 0 0;min-height:2px;}
.mchart-bar.ing{background:#1C8A66;} .mchart-bar.cos{background:#BF4E3D;}
.mchart-label{font-size:11px;color:var(--muted);white-space:nowrap;}
.mchart-legend{display:flex;gap:16px;justify-content:center;padding:10px 0 4px;font-size:12px;color:var(--muted);}
.mchart-legend .dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle;}
.dot.ing{background:#1C8A66;} .dot.cos{background:#BF4E3D;}
.empty{padding:34px 20px;text-align:center;color:var(--muted);}
.empty-title{font-weight:600;color:var(--ink);margin-bottom:4px;font-size:15px;}
.empty-sub{font-size:13px;}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 12px;margin-bottom:14px;color:var(--faint);}
.search input{border:none;outline:none;padding:11px 0;font-family:inherit;font-size:14px;width:100%;background:none;color:var(--ink);}
.seg{display:flex;gap:8px;}
.seg button{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);border-radius:10px;font-family:inherit;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer;transition:.12s;}
.seg button.active{background:var(--pos-soft);border-color:var(--brand);color:var(--brand);}
.subtabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--line);overflow-x:auto;}
.subtab{padding:9px 12px;margin-bottom:-1px;border:none;background:none;font-family:inherit;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
.subtab.active{color:var(--brand);border-bottom-color:var(--brand);}
.stmt-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:14px;border-bottom:1px solid var(--line);}
.stmt-row.sub{padding-left:14px;color:var(--muted);font-size:13.5px;}
.stmt-row.total{border-top:2px solid var(--ink);border-bottom:none;font-family:'Space Grotesk';font-weight:700;font-size:15.5px;margin-top:4px;padding-top:10px;}
.stmt-row .v{font-family:'Space Grotesk';font-weight:600;white-space:nowrap;}
.stmt-grp{font-family:'Space Grotesk';font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);margin:16px 0 4px;}
.overlay{position:fixed;inset:0;background:rgba(18,28,24,.44);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;}
.modal{background:var(--card);border-radius:16px;width:100%;max-width:460px;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(10,30,24,.3);}
.modal.wide{max-width:640px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:1;}
.modal-title{font-family:'Space Grotesk';font-weight:700;font-size:17px;}
.modal-body{padding:18px 20px 20px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px;}
.input,.select{width:100%;font-family:inherit;font-size:14.5px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);outline:none;transition:border-color .12s;}
.input:focus,.select:focus{border-color:var(--brand);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-error{background:var(--neg-soft);color:var(--neg);font-size:13px;font-weight:500;padding:9px 12px;border-radius:9px;margin-bottom:12px;}
.preview{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:14px;display:flex;justify-content:space-between;font-size:13.5px;}
.preview .amt{font-family:'Space Grotesk';font-weight:600;}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:4px;flex-wrap:wrap;}
.confirm-msg{font-size:14.5px;line-height:1.5;padding:22px 20px 6px;}
.cnt-row{display:grid;grid-template-columns:1fr 54px 78px 62px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;}
.cnt-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cnt-head{font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--faint);font-weight:700;border-bottom:2px solid var(--line);}
.cnt-in{width:100%;padding:6px 6px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:13px;text-align:right;background:var(--soft);}
.inv-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px;}
.inv-biz{font-family:'Space Grotesk';font-weight:700;font-size:20px;}
.inv-name{font-family:'Space Grotesk';font-weight:700;font-size:19px;color:var(--ink);line-height:1.12;}
.inv-sub{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.45;}
.inv-label{font-family:'Space Grotesk';font-weight:700;font-size:16px;color:var(--brand);text-align:right;}
.inv-meta{font-size:12.5px;color:var(--muted);text-align:right;margin-top:4px;line-height:1.5;}
.inv-cli{font-size:13px;margin-bottom:14px;padding:10px 12px;background:var(--soft);border-radius:8px;}
table.inv-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:12px;}
table.inv-table th{text-align:left;border-bottom:2px solid var(--line);padding:8px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);}
table.inv-table td{border-bottom:1px solid var(--line);padding:8px 6px;}
table.inv-table td.r,table.inv-table th.r{text-align:right;}
.inv-total{display:flex;justify-content:flex-end;gap:24px;font-family:'Space Grotesk';font-weight:700;font-size:18px;padding-top:6px;}
.inv-foot{margin-top:18px;font-size:12px;color:var(--muted);text-align:center;}
.loading{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:15px;gap:14px;text-align:center;padding:24px;}
.splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);text-align:center;padding:24px;z-index:50;}
.splash-logo{width:100px;height:100px;border-radius:26px;object-fit:contain;background:#fff;padding:7px;box-shadow:0 14px 36px rgba(16,40,33,.16);}
.splash-title{font-family:'Space Grotesk','DejaVu Sans',sans-serif;font-weight:700;font-size:29px;color:var(--ink);margin-top:22px;letter-spacing:.5px;}
.splash-sub{font-size:12.5px;color:var(--muted);margin-top:7px;letter-spacing:2.5px;text-transform:uppercase;}
.splash-msg{font-size:13px;color:var(--faint);margin-top:14px;}
.spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(165deg,#E9F1EC 0%,var(--bg) 52%);}
.auth-card{width:100%;max-width:400px;padding:32px 28px;box-shadow:0 14px 44px rgba(15,90,74,.12);}
.auth-logo{width:90px;height:90px;margin:0 auto 14px;border-radius:22px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.06);}
.auth-logo img{width:100%;height:100%;object-fit:contain;}
.auth-title{font-family:'Space Grotesk';font-weight:700;font-size:21px;text-align:center;letter-spacing:.01em;}
.auth-tag{text-align:center;color:var(--brand);font-size:11.5px;font-weight:600;letter-spacing:.08em;margin-top:4px;text-transform:uppercase;}
.auth-sub{color:var(--muted);font-size:13.5px;margin:16px 0 20px;line-height:1.5;text-align:center;}
.auth-toggle{margin-top:16px;text-align:center;font-size:13.5px;color:var(--muted);}
.auth-toggle button{background:none;border:none;color:var(--brand);font-weight:600;cursor:pointer;font-family:inherit;font-size:13.5px;padding:0;text-decoration:underline;}
.auth-msg{background:var(--pos-soft);color:var(--pos);font-size:13px;padding:10px 12px;border-radius:9px;margin-bottom:12px;line-height:1.45;}
.auth-foot{text-align:center;color:var(--faint);font-size:11px;margin-top:20px;letter-spacing:.04em;}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(6px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:24px;font-size:13.5px;font-weight:600;z-index:200;box-shadow:0 10px 28px rgba(0,0,0,.28);opacity:0;transition:opacity .25s ease, transform .25s ease;display:flex;align-items:center;gap:8px;max-width:88vw;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.ok{background:var(--pos);}
.toast.info{background:var(--brand);}
@media(min-width:721px){.toast{bottom:28px;}}
.install-banner{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));background:var(--brand-2);color:#fff;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;z-index:150;box-shadow:0 10px 28px rgba(0,0,0,.28);font-size:13.5px;font-weight:600;}
.install-banner span{flex:1;line-height:1.35;}
.install-banner .ib-cta{background:#fff;color:var(--brand-2);border:none;border-radius:8px;padding:7px 12px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap;}
.install-banner .ib-x{background:none;border:none;color:rgba(255,255,255,.75);font-size:15px;cursor:pointer;padding:2px 4px;}
@media(min-width:721px){.install-banner{left:auto;right:20px;max-width:360px;}}
#print-area{display:none;}
@media print{
  body, body.dark{ --ink:#16211D; --muted:#555; --faint:#888; --card:#fff; --bg:#fff; --line:#ddd; --soft:#f5f5f5; --pos:#1C8A66; --neg:#BF4E3D; --brand:#0F5A4A; }
  body *{visibility:hidden;}
  #print-area,#print-area *{visibility:visible;}
  #print-area{display:block;position:absolute;left:0;top:0;width:100%;padding:22px;}
  .no-print{display:none !important;}
}
@media (max-width:820px){
  .sidebar{display:none;}
  .app{min-height:auto;}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(8px + env(safe-area-inset-bottom));z-index:40;}
  .bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 1px;border:none;background:none;color:var(--faint);font-size:10.5px;font-weight:600;cursor:pointer;border-radius:9px;white-space:nowrap;}
  .bn-item.active{color:var(--brand);}
  .mobilebar{display:flex;align-items:center;justify-content:space-between;padding:11px 15px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:30;}
  .main{padding:16px 15px 92px;}
  .page-title{font-size:22px;}
  .hero-value{font-size:32px;}
  .cols2{grid-template-columns:1fr;}
  .bar-name{width:92px;} .bar-val{width:82px;}
}

    var base = (s && s.vence && parseDate(s.vence)>parseDate(today())) ? parseDate(s.vence) : parseDate(today());
    var d=new Date(base); d.setMonth(d.getMonth()+meses);
    sb.from('suscripciones').update({plan:tier, estado:'activa', vence:isoDate(d), updated_at:new Date().toISOString()}).eq('user_id',uid)
      .then(function(r){ if(r.error){ alert('No se pudo: '+r.error.message); return; } toast('Plan actualizado'); openAdmin(); });
  }

  function clienteBalance(id){
    var cred=0, ab=0;
    S.facturas.forEach(function(fa){ if(fa.tipo==='credito' && fa.clienteId===id) cred += facturaFinance(fa).total; });
    S.abonos.forEach(function(a){ if(a.clienteId===id) ab += a.monto; });
    return {credito:cred, abonos:ab, balance:cred-ab};
  }
  function facturaLines(id){ return S.sales.filter(function(s){ return s.facturaId===id; }); }
  function proveedorBalance(id){
    var deuda=0, pagos=0;
    S.costos.forEach(function(c){ if(c.credito && c.proveedorId===id) deuda+=c.monto; });
    S.gastos.forEach(function(g){ if(g.credito && g.proveedorId===id) deuda+=g.monto; });
    S.pagosProveedor.forEach(function(p){ if(p.proveedorId===id) pagos+=p.monto; });
    return {deuda:deuda, pagos:pagos, balance:deuda-pagos};
  }
  function cuentasPorPagar(){
    var cxp=0; S.proveedores.forEach(function(pr){ var b=proveedorBalance(pr.id).balance; if(b>0) cxp+=b; });
    return cxp;
  }
  var NCF_LABELS = {'B02':'Consumidor Final (B02)', 'B01':'Crédito Fiscal (B01)'};
  function ncfSeq(tipo){ return S.ncfSeqs.find(function(s){ return s.tipo===tipo; }); }
  function ncfVigente(s){ if(!s) return false; if(s.proximo>s.hasta) return false; if(s.vencimiento && today()>s.vencimiento) return false; return true; }
  function ncfFormat(tipo, n){ return tipo + ('00000000'+n).slice(-8); }
  function ncfTiposDisponibles(){ return S.ncfSeqs.filter(ncfVigente).map(function(s){ return s.tipo; }); }
  function ncfLabelDe(ncf){ if(!ncf) return ''; var t=ncf.slice(0,3); return NCF_LABELS[t]||t; }

  function docContacto(){
    var s=[];
    if(S.config.rnc) s.push('RNC: '+esc(S.config.rnc));
    if(S.config.telefono) s.push(esc(S.config.telefono));
    if(S.config.direccion) s.push(esc(S.config.direccion));
    return s.length ? '<div class="inv-sub">'+s.join(' · ')+'</div>' : '';
  }
  function facturaFinance(fa){
    var lines=facturaLines(fa.id); var gross=0, cogs=0;
    lines.forEach(function(l){ gross+=l.cantidad*l.precio; cogs+=l.cantidad*l.costo; });
    var desc=fa.descuento||0; if(desc<0) desc=0; if(desc>gross) desc=gross;
    var total=gross-desc;
    var rate=fa.itbis||0;
    var neto = rate>0 ? total/(1+rate/100) : total;
    var itbis = total-neto;
    return {lines:lines, gross:gross, desc:desc, total:total, rate:rate, neto:neto, itbis:itbis, cogs:cogs};
  }
  function facturaTotal(id){ var fa=S.facturas.find(function(x){return x.id===id;}); return fa?facturaFinance(fa).total:0; }

  function computeM(){
    var ventasBrutas=0, ingresos=0, itbisCobrado=0, cogs=0, gastosTotal=0, valorInventario=0, comprasTotal=0, descuentoTotal=0;
    S.facturas.forEach(function(fa){ var F=facturaFinance(fa); ventasBrutas+=F.total; ingresos+=F.neto; itbisCobrado+=F.itbis; cogs+=F.cogs; descuentoTotal+=F.desc; });
    S.gastos.forEach(function(g){ gastosTotal += g.monto; });
    S.products.forEach(function(p){ valorInventario += p.stock*p.costo; });
    S.costos.forEach(function(c){ comprasTotal += c.monto; });
    var utilidadBruta = ingresos - cogs;
    var utilidadNeta = utilidadBruta - gastosTotal;
    var lowStock = S.products.filter(function(p){ return p.stock <= p.stockMin; });
    var ticket = S.facturas.length ? ventasBrutas/S.facturas.length : 0;

    var cmap={};
    S.sales.forEach(function(s){ var k=(s.fecha||'').slice(0,7); if(!cmap[k]) cmap[k]={mes:k,Ingresos:0,Costo:0}; cmap[k].Ingresos+=s.cantidad*s.precio; cmap[k].Costo+=s.cantidad*s.costo; });
    var chart = Object.keys(cmap).map(function(k){return cmap[k];}).sort(function(a,b){return a.mes<b.mes?-1:a.mes>b.mes?1:0;}).slice(-8).map(function(d){
      var pp=d.mes.split('-'); return {Ingresos:d.Ingresos, Costo:d.Costo, label:(MESES[(+pp[1])-1]||'')+' '+(pp[0]||'').slice(2)};
    });

    var tmap={};
    S.sales.forEach(function(s){ tmap[s.nombre]=(tmap[s.nombre]||0)+s.cantidad*s.precio; });
    var top = Object.keys(tmap).map(function(n){return {nombre:n,total:tmap[n]};}).sort(function(a,b){return b.total-a.total;}).slice(0,5);

    var prodCat={}; S.products.forEach(function(p){ prodCat[p.id]=p.categoria||''; });
    var catmap={};
    S.sales.forEach(function(s){ var c=prodCat[s.productoId]||'Sin categoría'; catmap[c]=(catmap[c]||0)+s.cantidad*s.precio; });
    var ventasCat = Object.keys(catmap).map(function(c){return {cat:c,total:catmap[c]};}).sort(function(a,b){return b.total-a.total;});

    var creditByClient={}, abonoByClient={};
    S.facturas.forEach(function(fa){ if(fa.tipo==='credito' && fa.clienteId){ creditByClient[fa.clienteId]=(creditByClient[fa.clienteId]||0)+facturaFinance(fa).total; } });
    S.abonos.forEach(function(a){ abonoByClient[a.clienteId]=(abonoByClient[a.clienteId]||0)+a.monto; });
    var clientes = S.clientes.map(function(c){
      var cred=creditByClient[c.id]||0, ab=abonoByClient[c.id]||0;
      return {id:c.id, nombre:c.nombre, telefono:c.telefono, credito:cred, abonos:ab, balance:cred-ab};
    });
    var totalPorCobrar=0, totalCobrado=0;
    clientes.forEach(function(c){ if(c.balance>0) totalPorCobrar += c.balance; });
    S.abonos.forEach(function(a){ totalCobrado += a.monto; });
    var deudores = clientes.filter(function(c){ return c.balance>0.0001; }).sort(function(a,b){ return b.balance-a.balance; });

    var acts=[];
    S.facturas.forEach(function(fa){ var t=facturaTotal(fa.id); acts.push({fecha:fa.fecha, texto:'Venta · Factura #'+fa.numero, monto:t, signo:'+'}); });
    S.costos.forEach(function(c){ acts.push({fecha:c.fecha, texto:'Costo · '+c.descripcion, monto:c.monto, signo:'-'}); });
    S.gastos.forEach(function(g){ acts.push({fecha:g.fecha, texto:'Gasto · '+g.descripcion, monto:g.monto, signo:'-'}); });
    S.abonos.forEach(function(a){ var cl=S.clientes.find(function(x){return x.id===a.clienteId;}); acts.push({fecha:a.fecha, texto:'Abono · '+(cl?cl.nombre:'cliente'), monto:a.monto, signo:'+'}); });
    acts.sort(function(a,b){ return (a.fecha<b.fecha?1:a.fecha>b.fecha?-1:0); });
    acts = acts.slice(0,8);

    return {ingresos:ingresos, ventasBrutas:ventasBrutas, itbisCobrado:itbisCobrado, cogs:cogs, utilidadBruta:utilidadBruta, gastosTotal:gastosTotal, utilidadNeta:utilidadNeta,
      valorInventario:valorInventario, comprasTotal:comprasTotal, lowStock:lowStock, ticket:ticket, chart:chart, top:top, acts:acts, ventasCat:ventasCat,
      clientes:clientes, totalPorCobrar:totalPorCobrar, totalCobrado:totalCobrado, deudores:deudores};
  }

  function pctBadge(actual, anterior, invert){
    if(!anterior){ return actual>0 ? '<span class="chip pos">Nuevo</span>' : '<span class="chip">Sin datos previos</span>'; }
    var pct = Math.round((actual-anterior)/Math.abs(anterior)*100);
    if(pct===0) return '<span class="chip">Igual que el mes anterior</span>';
    var up = pct>0, good = invert ? !up : up;
    return '<span class="chip '+(good?'pos':'warn')+'">'+(up?'↑':'↓')+' '+Math.abs(pct)+'% vs mes anterior</span>';
  }

  function computeAlertas(M){
    var out=[]; var now=new Date(); var day=now.getDate(); var mon=now.getMonth();
    function diasDesde(s){ var d=parseDate(s); return d?Math.floor((now-d)/86400000):0; }
    function diasHasta(s){ var d=parseDate(s); return d?Math.floor((d-now)/86400000):null; }
    var mp=resultados('mespasado');
    if(mp.itbis>0.5 && day<=20){ out.push({nivel:'warn', txt:'Declara el ITBIS de '+MESES[(mon+11)%12]+' ('+money(mp.itbis)+') antes del día 20 (Formulario IT-1).'}); }
    var viejos=0, montoViejo=0;
    S.clientes.forEach(function(c){
      var bal=clienteBalance(c.id).balance; if(bal<=0.5) return;
      var oldest=null; S.facturas.forEach(function(fa){ if(fa.tipo==='credito' && fa.clienteId===c.id){ if(!oldest||fa.fecha<oldest) oldest=fa.fecha; } });
      if(oldest && diasDesde(oldest)>30){ viejos++; montoViejo+=bal; }
    });
    if(viejos>0) out.push({nivel:'warn', txt:viejos+' cliente(s) te deben desde hace más de 30 días ('+money(montoViejo)+').', view:'clientes'});
    S.ncfSeqs.forEach(function(s){
      var restante=s.hasta-s.proximo+1; var vh=diasHasta(s.vencimiento);
      if(restante<=0) out.push({nivel:'danger', txt:'Tu secuencia '+s.tipo+' se agotó. Solicita una nueva a la DGII.'});
      else if(restante<=10) out.push({nivel:'warn', txt:'A tu secuencia '+s.tipo+' le quedan '+restante+' comprobante(s).'});
      if(vh!==null){ if(vh<0) out.push({nivel:'danger', txt:'Tu secuencia '+s.tipo+' venció el '+fmtDate(s.vencimiento)+'.'}); else if(vh<=30) out.push({nivel:'warn', txt:'Tu secuencia '+s.tipo+' vence el '+fmtDate(s.vencimiento)+' (en '+vh+' días).'}); }
    });
    if(mon===11){
      var pend=S.empleados.filter(function(e){ return e.activo && !regaliaEmpleado(e).pagada; }).length;
      if(pend>0) out.push({nivel:'info', txt:'La regalía pascual vence el 20 de diciembre. Tienes '+pend+' empleado(s) por pagar.', modal:'regalia'});
    }
    return out;
  }

      + kpiCmp('Facturas', fcMes, pctBadge(fcMes, fcMp))

  function ventRows(){

        if(cli.indexOf(q)>=0) return true;

  // ---------- finanzas ----------
  function periodoRango(p){
    var now=new Date(); var y=now.getFullYear(), mo=now.getMonth();
    function ds(dt){ var t=new Date(dt.getTime()-dt.getTimezoneOffset()*60000); return t.toISOString().slice(0,10); }
    if(p==='mes'){ return {ini:ds(new Date(y,mo,1)), fin:ds(new Date(y,mo+1,0)), label:'Este mes ('+MESES[mo]+' '+y+')'}; }
    if(p==='mespasado'){ var pm=new Date(y,mo-1,1); return {ini:ds(new Date(pm.getFullYear(),pm.getMonth(),1)), fin:ds(new Date(pm.getFullYear(),pm.getMonth()+1,0)), label:'Mes pasado ('+MESES[pm.getMonth()]+' '+pm.getFullYear()+')'}; }
    if(p==='ano'){ return {ini:y+'-01-01', fin:y+'-12-31', label:'Este año ('+y+')'}; }
    if(p==='ytd'){ return {ini:y+'-01-01', fin:ds(now), label:'Año a la fecha ('+y+')'}; }
    if(p==='mesanopasado'){ var ay=y-1; return {ini:ds(new Date(ay,mo,1)), fin:ds(new Date(ay,mo+1,0)), label:MESES[mo]+' '+ay}; }
    return {ini:'0000-01-01', fin:'9999-12-31', label:'Todo el tiempo'};
  }
  function periodoOpts(p){
    var p=S.finPeriodo||'mes';
    var arr=[['mes','Este mes'],['mespasado','Mes pasado'],['ano','Este año'],['todo','Todo el tiempo']];
    return arr.map(function(o){ return '<option value="'+o[0]+'"'+(o[0]===p?' selected':'')+'>'+o[1]+'</option>'; }).join('');
  }
  function resultados(p){
    var r=periodoRango(p);
    var ventas=0, ingresos=0, itbis=0, cogs=0;
    S.facturas.forEach(function(fa){ if(fa.fecha>=r.ini && fa.fecha<=r.fin){ var F=facturaFinance(fa); ventas+=F.total; ingresos+=F.neto; itbis+=F.itbis; cogs+=F.cogs; } });
    var bruta=ingresos-cogs;
    var gByCat={}, gTot=0;
    S.gastos.forEach(function(g){ if(g.fecha>=r.ini && g.fecha<=r.fin){ gByCat[g.categoria]=(gByCat[g.categoria]||0)+g.monto; gTot+=g.monto; } });
    var neta=bruta-gTot;
    return {rango:r, ventas:ventas, ingresos:ingresos, itbis:itbis, cogs:cogs, bruta:bruta, gByCat:gByCat, gTot:gTot, neta:neta};
  }

  function flujoEfectivo(p){
    var r=periodoRango(p);
    var contado=0, abonos=0, compras=0, gastosCash=0, pagosProv=0, aportes=0, retiros=0;
    S.facturas.forEach(function(fa){ if(fa.fecha>=r.ini && fa.fecha<=r.fin && fa.tipo==='contado') contado+=facturaFinance(fa).total; });
    S.abonos.forEach(function(a){ if(a.fecha>=r.ini && a.fecha<=r.fin) abonos+=a.monto; });
    S.costos.forEach(function(c){ if(c.fecha>=r.ini && c.fecha<=r.fin && !c.credito) compras+=c.monto; });
    S.gastos.forEach(function(g){ if(g.fecha>=r.ini && g.fecha<=r.fin && !g.credito && g.categoria!=='Merma') gastosCash+=g.monto; });
    S.pagosProveedor.forEach(function(pp){ if(pp.fecha>=r.ini && pp.fecha<=r.fin) pagosProv+=pp.monto; });
    S.capital.forEach(function(k){ if(k.fecha>=r.ini && k.fecha<=r.fin){ if(k.tipo==='retiro') retiros+=k.monto; else aportes+=k.monto; } });
    var operacion=contado+abonos-compras-gastosCash-pagosProv, financiamiento=aportes-retiros;
    return {rango:r, contado:contado, abonos:abonos, compras:compras, gastosCash:gastosCash, pagosProv:pagosProv, aportes:aportes, retiros:retiros, operacion:operacion, financiamiento:financiamiento, cambio:operacion+financiamiento};
  }

    return ''
      + '<div class="hero-label">Estado de Flujo de Efectivo</div>'
      + '<div class="tiny-muted" style="margin:4px 0 6px">'+esc(F.rango.label)+' · '+esc(S.config.negocio)+'</div>'
      + '<div class="stmt-grp">Actividades de operación</div>'

      + '<div class="stmt-row total"><span>Efectivo neto de operación</span><span class="v" style="color:'+(F.operacion>=0?'var(--pos)':'var(--neg)')+'">'+money(F.operacion)+'</span></div>'
      + '<div class="stmt-grp">Actividades de inversión</div>'

      + '<div class="stmt-row total" style="font-size:17px;border-top-width:3px"><span>Aumento (disminución) de efectivo</span><span class="v" style="color:'+(F.cambio>=0?'var(--pos)':'var(--neg)')+'">'+money(F.cambio)+'</span></div>'
      + '<div class="tiny-muted" style="margin-top:10px;line-height:1.5">Muestra el dinero que realmente entró y salió en el período. Las ventas a crédito no cuentan hasta que el cliente paga (abono); la merma no cuenta porque no mueve efectivo.</div>';
  }
  function cambiosPatrimonio(p){
    var r=periodoRango(p);
    var apP=0, retP=0, utilP=0, apB=0, retB=0, utilB=0;
    S.capital.forEach(function(k){ if(k.fecha>=r.ini && k.fecha<=r.fin){ if(k.tipo==='retiro') retP+=k.monto; else apP+=k.monto; } else if(k.fecha<r.ini){ if(k.tipo==='retiro') retB+=k.monto; else apB+=k.monto; } });
    S.facturas.forEach(function(fa){ var F=facturaFinance(fa); var u=F.neto-F.cogs; if(fa.fecha>=r.ini && fa.fecha<=r.fin) utilP+=u; else if(fa.fecha<r.ini) utilB+=u; });
    S.gastos.forEach(function(g){ if(g.fecha>=r.ini && g.fecha<=r.fin) utilP-=g.monto; else if(g.fecha<r.ini) utilB-=g.monto; });
    var ajuste=balanceGeneral().ajuste;
    var saldoInicial=ajuste+(apB-retB)+utilB;
    var saldoFinal=saldoInicial+(apP-retP)+utilP;
    return {rango:r, saldoInicial:saldoInicial, aportes:apP, retiros:retP, utilidad:utilP, saldoFinal:saldoFinal};
  }

  function comparativaDocHTML(){

  function balanceGeneral(){
    var ventasContado=0, itbisCobrado=0, cogs=0, totalCredito=0, ingresosNet=0;
    S.facturas.forEach(function(fa){
      var F=facturaFinance(fa);
      itbisCobrado+=F.itbis; cogs+=F.cogs; ingresosNet+=F.neto;
      if(fa.tipo==='contado') ventasContado+=F.total; else if(fa.tipo==='credito') totalCredito+=F.total;
    });
    var abonos=0; S.abonos.forEach(function(a){ abonos+=a.monto; });
    var comprasPagadas=0, comprasCredito=0; S.costos.forEach(function(c){ if(c.credito) comprasCredito+=c.monto; else comprasPagadas+=c.monto; });
    var gastosCash=0, gastosTotal=0, gastosCredito=0; S.gastos.forEach(function(g){ gastosTotal+=g.monto; if(g.credito){ gastosCredito+=g.monto; } else if(g.categoria!=='Merma'){ gastosCash+=g.monto; } });
    var pagosProv=0; S.pagosProveedor.forEach(function(p){ pagosProv+=p.monto; });
    var aportes=0, retiros=0; S.capital.forEach(function(k){ if(k.tipo==='retiro') retiros+=k.monto; else aportes+=k.monto; });
    var efectivo = aportes + ventasContado + abonos - comprasPagadas - gastosCash - pagosProv - retiros;
    var inventario=0; S.products.forEach(function(p){ inventario+=p.stock*p.costo; });
    var cxc = totalCredito - abonos;
    var cxp = cuentasPorPagar();
    var totalActivos = efectivo + inventario + cxc;
    var totalPasivos = itbisCobrado + cxp;
    var patrimonio = totalActivos - totalPasivos;
    var capitalNeto = aportes - retiros;
    var utilidadAcum = ingresosNet - cogs - gastosTotal;
    var ajuste = patrimonio - capitalNeto - utilidadAcum;
    return {efectivo:efectivo, inventario:inventario, cxc:cxc, totalActivos:totalActivos, itbisPorPagar:itbisCobrado, cxp:cxp, totalPasivos:totalPasivos, capitalNeto:capitalNeto, utilidadAcum:utilidadAcum, ajuste:ajuste, patrimonio:patrimonio};
  }

  function calcLiquidacion(sueldo, ing, sal, tipo, preavisoDado){
    var diario=sueldo/23.83;
    var tm=mesesEntre(ing,sal);
    var cy=Math.floor(tm/12); var extra=tm-cy*12;
    var desahucio=(tipo==='desahucio');
    var preDias=0;
    if(desahucio && !preavisoDado){ if(tm>=12) preDias=28; else if(tm>=6) preDias=14; else if(tm>=3) preDias=7; }
    var cesDias=0;
    if(desahucio){
      if(tm>=12){ var rate=tm>=60?23:21; cesDias=cy*rate; if(extra>=6) cesDias+=13; else if(extra>=3) cesDias+=6; }
      else if(tm>=6) cesDias=13; else if(tm>=3) cesDias=6;
    }
    var baseVac=tm>=60?18:14;
    var vacMonths = tm>=12 ? extra : tm;
    var vacDias = baseVac*(vacMonths/12);
    var inicioAno=new Date(sal.getFullYear(),0,1);
    var effStart=(ing>inicioAno)?ing:inicioAno;
    var mesesAno=Math.min(mesesEntre(effStart,sal),12);

  function report607(p){
    var r=periodoRango(p), rows=[];
    S.facturas.forEach(function(fa){
      if(!fa.ncf || fa.fecha<r.ini || fa.fecha>r.fin) return;
      var F=facturaFinance(fa), rnc=rncClean(fa.rncCliente);
      rows.push({rnc:rnc, tipoId:tipoIdDe(rnc), ncf:fa.ncf, fecha:fechaDGII(fa.fecha), base:F.neto, itbis:F.itbis, tipo:fa.tipo, total:F.total});
    });
    return {rango:r, rows:rows};
  }
  function report606(p){
    var r=periodoRango(p), rows=[];
    function add(x){
      if(!x.ncf || x.fecha<r.ini || x.fecha>r.fin) return;
      var itbis=x.itbis||0, base=x.monto-itbis; if(base<0) base=x.monto;
      var rnc=rncClean(x.rncProveedor);
      rows.push({rnc:rnc, tipoId:tipoIdDe(rnc), tipoBien:x.tipoBien||'', ncf:x.ncf, fecha:fechaDGII(x.fecha), base:base, itbis:itbis});
    }
    S.costos.forEach(add); S.gastos.forEach(add);
    return {rango:r, rows:rows};
  }

  function rentabilidad(p){
    var r=periodoRango(p);
    var factRate={}; S.facturas.forEach(function(fa){ factRate[fa.id]=fa.itbis||0; });
    var map={};
    S.sales.forEach(function(s){
      if(s.fecha<r.ini || s.fecha>r.fin) return;
      var rate=factRate[s.facturaId]||0;
      var neto = rate>0 ? s.precio/(1+rate/100) : s.precio;
      var k=s.productoId||s.nombre;
      if(!map[k]) map[k]={nombre:s.nombre, uds:0, ventas:0, costo:0};
      map[k].uds+=s.cantidad; map[k].ventas+=s.cantidad*neto; map[k].costo+=s.cantidad*s.costo;
    });
    var rows=Object.keys(map).map(function(k){ var m=map[k]; m.utilidad=m.ventas-m.costo; m.margen=m.ventas>0?Math.round(m.utilidad/m.ventas*100):0; return m; });
    rows.sort(function(a,b){ return b.utilidad-a.utilidad; });
    return {rango:r, rows:rows};
  }

  function cierreCaja(f){
    var contado=0, abonos=0, aportes=0, compras=0, gastos=0, pagosProv=0, retiros=0;
    S.facturas.forEach(function(fa){ if(fa.fecha===f && fa.tipo==='contado') contado+=facturaFinance(fa).total; });
    S.abonos.forEach(function(a){ if(a.fecha===f) abonos+=a.monto; });
    S.capital.forEach(function(k){ if(k.fecha===f){ if(k.tipo==='retiro') retiros+=k.monto; else aportes+=k.monto; } });
    S.costos.forEach(function(c){ if(c.fecha===f && !c.credito) compras+=c.monto; });
    S.gastos.forEach(function(g){ if(g.fecha===f && !g.credito && g.categoria!=='Merma') gastos+=g.monto; });
    S.pagosProveedor.forEach(function(p){ if(p.fecha===f) pagosProv+=p.monto; });
    var entradas=contado+abonos+aportes, salidas=compras+gastos+pagosProv+retiros;
    return {contado:contado, abonos:abonos, aportes:aportes, compras:compras, gastos:gastos, pagosProv:pagosProv, retiros:retiros, entradas:entradas, salidas:salidas, neto:entradas-salidas};

  function desempeno(p){
    var r=periodoRango(p), map={};
    S.facturas.forEach(function(fa){
      if(fa.fecha<r.ini || fa.fecha>r.fin) return;
      var F=facturaFinance(fa), k=fa.vendedorId||'__none__';
      if(!map[k]) map[k]={id:k, ventas:0, count:0, utilidad:0};
      map[k].ventas+=F.total; map[k].count++; map[k].utilidad+=(F.neto-F.cogs);
    });
    var rows=Object.keys(map).map(function(k){
      var m=map[k];
      m.nombre = k==='__none__' ? 'Dueño / sin asignar' : (((S.empleados.find(function(e){return e.id===k;}))||{}).nombre||'(empleado eliminado)');
      return m;
    });
    rows.sort(function(a,b){ return b.ventas-a.ventas; });
    return {rango:r, rows:rows};
  }

    var D=desempeno(S.desPer||'mes'), tv=0,tc=0,tu=0;

    function grid(a,b,c,d,tot){ return '<div style="display:grid;grid-template-columns:1.6fr 0.6fr 1fr 1fr;gap:6px;padding:8px 0;border-bottom:1px solid var(--line);'+(tot?'font-weight:700;border-top:2px solid var(--ink);':'')+'font-size:12.5px"><span>'+a+'</span><span class="num" style="text-align:right">'+b+'</span><span class="num" style="text-align:right">'+c+'</span><span class="num" style="text-align:right">'+d+'</span></div>'; }

  function logoUpload(input){
    var file=input && input.files && input.files[0]; if(!file) return;
    if(!/^image\//.test(file.type)){ alert('Elige un archivo de imagen (PNG o JPG).'); return; }
    var reader=new FileReader();
    reader.onload=function(ev){
      var img=new Image();
      img.onload=function(){
        var size=220, cv=document.createElement('canvas'); cv.width=size; cv.height=size;
        var ctx=cv.getContext('2d'); ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,size,size);
        var sc=Math.min(size/img.width, size/img.height), w=img.width*sc, h=img.height*sc;
        ctx.drawImage(img,(size-w)/2,(size-h)/2,w,h);
        var b64=cv.toDataURL('image/jpeg',0.82);
        if(el('f_logo')) el('f_logo').value=b64;
        var p=el('logo-preview'); if(p) p.src=b64;
        toast('Logo listo (guarda para aplicar)','info');
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  }

    var rows=S.cart.map(function(l,i){
      var g=esGratis(l);
      var meta = g ? '<span class="chip pos">Gratis</span>' : '<span>'+l.cantidad+' × '+money(l.precio)+'</span>';

    }).join('');

  function autorizarDesc(){

  function descRecalc(){
    var gross=0; S.cart.forEach(function(l){ gross+=l.cantidad*l.precio; });
    var v=num(el('v_desc')?el('v_desc').value:0);
    var desc = (S.descMode==='pct') ? gross*v/100 : v;
    if(desc<0) desc=0; if(desc>gross) desc=gross;
    var e=el('v_totalpagar'); if(e) e.textContent=money(gross-desc);
  }
  function setDescMode(m){
    S.descMode=m;
    var a=el('seg_descrd'), b=el('seg_descpct');
    if(a&&b){ a.className=(m==='rd'?'active':''); b.className=(m==='pct'?'active':''); }

  function addToCart(){
    var sel=el('f_prod'); if(!sel) return;
    var prod=S.products.find(function(x){return x.id===sel.value;});
    if(!prod) return showErr('Selecciona un producto.');
    var cant=num(el('f_cant').value);
    if(cant<=0) return showErr('Escribe una cantidad mayor que cero.');
    var enCarrito=0; S.cart.forEach(function(l){ if(l.productoId===prod.id) enCarrito+=l.cantidad; });
    if(cant+enCarrito > prod.stock) return showErr('Solo hay '+prod.stock+' en stock de '+prod.nombre+(enCarrito?' (ya agregaste '+enCarrito+')':'')+'.');
    var gratis = el('f_gratis') && el('f_gratis').checked;
    var precio = gratis ? 0 : num(el('f_vprecio').value);
    S.cart.push({productoId:prod.id, nombre:prod.nombre, cantidad:cant, precio:precio, costo:prod.costo, gratis:!!gratis});
    el('f_cant').value='';
    if(el('f_gratis')) el('f_gratis').checked=false;
    var e=el('modal-error'); if(e) e.style.display='none';
    renderCart();
  }
  function esGratis(l){ return l.gratis || l.precio===0; }
  function promoBannerHTML(){
    var pid=S.config.promoProducto, cada=num(S.config.promoCada);
    if(!pid || cada<=0) return '';
    var prod=S.products.find(function(x){return x.id===pid;});
    if(!prod) return '';
    var paid=0, free=0, inCart=0;
    S.cart.forEach(function(l){ if(esGratis(l)){ if(l.productoId===pid) free+=l.cantidad; } else { paid+=l.cantidad; } if(l.productoId===pid) inCart+=l.cantidad; });
    var pending = Math.floor(paid/cada) - free;
    if(pending<=0) return '';
    var avail = prod.stock - inCart;
    if(avail<=0) return '';
    var toGive = pending>avail?avail:pending;
    return '<div style="background:var(--pos-soft);border:1px solid var(--pos);border-radius:10px;padding:11px 13px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px"><div style="font-size:13px;color:var(--brand);font-weight:600">🎁 El cliente lleva '+toGive+' '+esc(prod.nombre)+' gratis</div><button type="button" class="btn btn-primary btn-sm" onclick="APP.addPromoGratis()">Agregar gratis</button></div>';
  }
  function addPromoGratis(){
    var pid=S.config.promoProducto, cada=num(S.config.promoCada);
    var prod=S.products.find(function(x){return x.id===pid;});
    if(!prod || cada<=0) return;
    var paid=0, free=0, inCart=0;
    S.cart.forEach(function(l){ if(esGratis(l)){ if(l.productoId===pid) free+=l.cantidad; } else { paid+=l.cantidad; } if(l.productoId===pid) inCart+=l.cantidad; });
    var pending = Math.floor(paid/cada) - free;
    if(pending<=0) return;
    var avail = prod.stock - inCart;
    if(pending>avail) pending=avail;
    if(pending<=0){ showErr('No hay suficiente stock de '+prod.nombre+' para el regalo.'); return; }
    S.cart.push({productoId:prod.id, nombre:prod.nombre, cantidad:pending, precio:0, costo:prod.costo, gratis:true});
    renderCart();
  }
  function removeCartLine(i){ S.cart.splice(i,1); renderCart(); }

  // ---------- conteo ----------
  function conteoRecalc(){
    var faltVal=0, sobVal=0;
    S.products.forEach(function(p){
      var inp=el('cf_'+p.id); if(!inp) return;
      var fis=num(inp.value); var diff=fis-p.stock;
      var cd=el('cd_'+p.id);
      if(cd){ cd.textContent=(diff>0?'+':'')+diff; cd.style.color = diff<0?'#BF4E3D':(diff>0?'#1C8A66':'var(--muted)'); }
      if(diff<0) faltVal += (-diff)*p.costo; else if(diff>0) sobVal += diff*p.costo;
    });
    var tot=el('cnt-tot');
    if(tot){
      if(faltVal>0 && sobVal>0){ tot.textContent='Falta '+money(faltVal)+' · Sobra '+money(sobVal); tot.style.color='var(--ink)'; }
      else if(faltVal>0){ tot.textContent='− '+money(faltVal)+' (faltante)'; tot.style.color='#BF4E3D'; }
      else if(sobVal>0){ tot.textContent='+ '+money(sobVal)+' (sobrante)'; tot.style.color='#1C8A66'; }
      else { tot.textContent='Todo cuadra'; tot.style.color='#1C8A66'; }
    }
  }
  function guardarConteo(ajustar){
    var items=[], faltVal=0, cambios=[];
    S.products.forEach(function(p){
      var inp=el('cf_'+p.id); var fis=inp?num(inp.value):p.stock;
      items.push({producto_id:p.id, nombre:p.nombre, stock_sistema:p.stock, stock_fisico:fis, costo:p.costo});
      var diff=fis-p.stock;
      if(diff<0) faltVal += (-diff)*p.costo;
      if(diff!==0) cambios.push({id:p.id, fisico:fis});
    });
    var sobVal=0; S.products.forEach(function(p){ var inp=el('cf_'+p.id); var fis=inp?num(inp.value):p.stock; var d=fis-p.stock; if(d>0) sobVal+=d*p.costo; });
    var nota = el('cf_nota')?el('cf_nota').value.trim():'';
    var b1=el('cnt-save'), b2=el('cnt-adjust'); if(b1)b1.disabled=true; if(b2)b2.disabled=true;
    function cfail(e){ if(b1)b1.disabled=false; if(b2)b2.disabled=false; var er=el('conteo-error'); if(er){ er.textContent='No se pudo guardar: '+(e&&e.message?e.message:e); er.style.display='block'; } }
    var cid;
    sb.from('conteos').insert({fecha:today(), nota:nota, ajustado:!!ajustar, faltante_valor:faltVal, sobrante_valor:sobVal}).select('id').single()
      .then(function(r){ if(r.error) throw r.error; cid=r.data.id; return sb.from('conteo_items').insert(items.map(function(it){ it.conteo_id=cid; return it; })); })
      .then(function(r){ if(r.error) throw r.error; if(!ajustar || !cambios.length) return null; return Promise.all(cambios.map(function(c){ return sb.from('productos').update({stock:c.fisico}).eq('id',c.id); })); })
      .then(function(){ if(ajustar && faltVal>0){ return sb.from('gastos').insert({descripcion:'Merma por conteo físico', categoria:'Merma', monto:faltVal, fecha:today()}); } return null; })
      .then(function(){ closeModal(true); loadAll(); }).catch(cfail);
  }

  function toast(msg, type){

      var t=document.createElement('div');
      t.className='toast '+(type||'ok');
      t.innerHTML=((type&&type!=='ok')?'':'<span>✓</span>')+'<span>'+esc(msg)+'</span>';

  function csvEscape(v){ v=String(v==null?'':v); return /[",\n\r;]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
  function downloadCSV(filename, headers, rows){
    var lines=[headers.map(csvEscape).join(',')];
    rows.forEach(function(r){ lines.push(r.map(csvEscape).join(',')); });
    var csv='\ufeff'+lines.join('\r\n');
    try{
      var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
      var url=URL.createObjectURL(blob);
      var a=document.createElement('a'); a.href=url; a.download=filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); },1500);
      toast('Archivo descargado');
    }catch(e){ alert('No se pudo exportar: '+(e.message||e)); }
  }

      var F=facturaFinance(fa);
      var cli=''; if(fa.clienteId){ var c=S.clientes.find(function(x){return x.id===fa.clienteId;}); cli=c?c.nombre:''; }
      return [fa.numero, fa.ncf||'', fa.rncCliente||'', fa.fecha, cli, (fa.tipo==='credito'?'Credito':'Contado'), F.gross.toFixed(2), F.desc.toFixed(2), F.neto.toFixed(2), F.itbis.toFixed(2), F.total.toFixed(2)];
    });
    downloadCSV('ventas.csv', ['Factura','NCF','RNC Cliente','Fecha','Cliente','Tipo','Subtotal','Descuento','Base gravada','ITBIS','Total'], rows);
  }
  function exportClientes(){
    var M=computeM();
    var rows=M.clientes.map(function(c){ var full=S.clientes.find(function(x){return x.id===c.id;})||{}; return [c.nombre, full.telefono||'', c.credito.toFixed(2), c.abonos.toFixed(2), c.balance.toFixed(2)]; });
    downloadCSV('clientes.csv', ['Cliente','Telefono','Fiado total','Abonos','Saldo pendiente'], rows);
  }
  function exportGastos(){
    var rows=S.gastos.map(function(g){ return [g.fecha, g.descripcion, g.categoria, g.monto.toFixed(2)]; });
    downloadCSV('gastos.csv', ['Fecha','Descripcion','Categoria','Monto'], rows);
  }
  function exportCompras(){
    var rows=S.costos.map(function(c){ return [c.fecha, c.descripcion, c.categoria, c.monto.toFixed(2)]; });
    downloadCSV('compras.csv', ['Fecha','Descripcion','Categoria','Monto'], rows);
  }
  function exportBackup(){
    var data={ _meta:{ app:'Control de Negocio', negocio:S.config.negocio, fecha:new Date().toISOString(), version:1 },
      config:S.config, productos:S.products, ventas:S.sales, facturas:S.facturas, costos:S.costos, gastos:S.gastos,
      clientes:S.clientes, abonos:S.abonos, conteos:S.conteos, capital:S.capital, empleados:S.empleados };
    try{
      var json=JSON.stringify(data, null, 2);
      var blob=new Blob([json],{type:'application/json;charset=utf-8;'});
      var url=URL.createObjectURL(blob);
      var a=document.createElement('a'); a.href=url;
      a.download='respaldo-'+((S.config.negocio||'negocio').replace(/[^a-z0-9]+/gi,'-').toLowerCase())+'-'+today()+'.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); },1500);
      toast('Respaldo descargado');
    }catch(e){ alert('No se pudo crear el respaldo: '+(e.message||e)); }
  }

  // ---------- delete with confirm ----------
  function confirmBox(msg){
    el('modal-root').innerHTML = '<div class="overlay" onclick="APP.closeModal()"><div class="modal" style="max-width:380px" onclick="event.stopPropagation()">'
      + '<div class="confirm-msg">'+esc(msg)+'</div>'
      + '<div class="modal-foot" style="padding:14px 20px 20px"><button class="btn btn-ghost" onclick="APP.closeModal()">Cancelar</button><button class="btn btn-danger" onclick="APP.confirmYes()">Eliminar</button></div>'
      + '</div></div>';
  }
  function ask(msg, action){ S.pending = action; confirmBox(msg); }
  function confirmYes(){ var a=S.pending; S.pending=null; el('modal-root').innerHTML=''; if(a) a(); }

  function removeFactura(id){
    var fa=S.facturas.find(function(x){return x.id===id;}); if(!fa) return;
    ask('¿Eliminar la factura #'+fa.numero+'? Se devolverá el stock de sus productos.', function(){
      var lines=facturaLines(id); var qtyByProd={};
      lines.forEach(function(l){ if(l.productoId) qtyByProd[l.productoId]=(qtyByProd[l.productoId]||0)+l.cantidad; });
      Promise.all(Object.keys(qtyByProd).map(function(pid){ var p=S.products.find(function(x){return x.id===pid;}); if(!p) return null; return sb.from('productos').update({stock:p.stock+qtyByProd[pid]}).eq('id',pid); }))
        .then(function(){ return sb.from('facturas').delete().eq('id',id); })
        .then(function(){ loadAll(); });
    });
  }
  function removeCosto(id){ var c=S.costos.find(function(x){return x.id===id;}); if(!c)return; ask('¿Eliminar este costo?', function(){ sb.from('costos').delete().eq('id',c.id).then(function(){ loadAll(); }); }); }
  function removeGasto(id){ var g=S.gastos.find(function(x){return x.id===id;}); if(!g)return; ask('¿Eliminar este gasto?', function(){ sb.from('gastos').delete().eq('id',g.id).then(function(){ loadAll(); }); }); }
  function removeProduct(id){ var p=S.products.find(function(x){return x.id===id;}); if(!p)return; ask('¿Eliminar "'+p.nombre+'"? Sus ventas registradas se conservan.', function(){ sb.from('productos').delete().eq('id',p.id).then(function(){ loadAll(); }); }); }
  function removeCliente(id){ var c=S.clientes.find(function(x){return x.id===id;}); if(!c)return; ask('¿Eliminar a "'+c.nombre+'"? Se borrará su historial de abonos. Sus ventas se conservan como ingresos.', function(){ sb.from('clientes').delete().eq('id',c.id).then(function(){ loadAll(); }); }); }
  function removeAbono(id){ var a=S.abonos.find(function(x){return x.id===id;}); if(!a)return; ask('¿Eliminar este abono?', function(){ sb.from('abonos').delete().eq('id',a.id).then(function(){ loadAll(); }); }); }
  function removeCapital(id){ var k=S.capital.find(function(x){return x.id===id;}); if(!k)return; ask('¿Eliminar este movimiento de capital?', function(){ sb.from('capital').delete().eq('id',k.id).then(function(){ loadAll(); }); }); }
  function removeEmpleado(id){ var e=S.empleados.find(function(x){return x.id===id;}); if(!e)return; ask('¿Eliminar a '+e.nombre+'? Sus pagos ya registrados se mantienen en los gastos.', function(){ sb.from('empleados').delete().eq('id',e.id).then(function(){ loadAll(); }); }); }
  function removeProveedor(id){ var p=S.proveedores.find(function(x){return x.id===id;}); if(!p)return; ask('¿Eliminar a '+p.nombre+'? Sus compras y pagos registrados se mantienen.', function(){ sb.from('proveedores').delete().eq('id',p.id).then(function(){ loadAll(); }); }); }

  // ---------- auth ----------
  function login(){
    S.authError=''; S.authMsg=''; S.authBusy=true; render();
    sb.auth.signInWithPassword({email:(S.authEmail||'').trim(), password:S.authPass||''}).then(function(res){
      S.authBusy=false; if(res.error){ S.authError=traducir(res.error.message); render(); }
    });
  }
  function signup(){
    S.authError=''; S.authMsg=''; S.authBusy=true; render();
    sb.auth.signUp({email:(S.authEmail||'').trim(), password:S.authPass||''}).then(function(res){
      S.authBusy=false;
      if(res.error){ S.authError=traducir(res.error.message); render(); return; }
      if(!res.data.session){ S.authMsg='Cuenta creada. Si no puedes entrar de una vez, revisa tu correo para confirmarla (o pídeme que la active).'; render(); }
    });
  }
  function logout(){ sb.auth.signOut(); }

  function enterVendedor(){
    if(!S.config.adminPin){ alert('Primero escribe un PIN de administrador en Configuración y guárdalo. Ese PIN te servirá para salir del modo vendedor.'); return; }
    var sellers=vendedoresConPin();
    if(!sellers.length){ alert('Primero ponle un PIN a un empleado en Finanzas → Nómina (edita su ficha y escribe un “PIN de vendedor”).'); return; }
    el('modal-root').innerHTML = '<div class="overlay"><div class="modal" style="max-width:380px"><div class="modal-head"><div class="modal-title">Iniciar turno de vendedor</div><button class="icon-btn" onclick="APP.closeModal(true)">'+icon('x',16)+'</button></div><div class="modal-body">'
      + '<div id="vlog-error" class="form-error" style="display:none"></div>'
      + '<div class="tiny-muted" style="margin-bottom:12px">Elige tu nombre y escribe tu PIN para comenzar a vender. Tus ventas quedarán registradas a tu nombre.</div>'
      + '<div class="field"><label>Vendedor</label><select id="f_vlogemp" class="select">'+sellers.map(function(e){ return '<option value="'+e.id+'">'+esc(e.nombre)+'</option>'; }).join('')+'</select></div>'
      + '<div class="field"><label>PIN</label><input id="f_vlogpin" class="input num" type="password" inputmode="numeric" placeholder="PIN" onkeydown="if(event.key===\'Enter\')APP.enterAsSeller()"></div>'
      + '<div class="modal-foot"><button class="btn btn-ghost" onclick="APP.closeModal(true)">Cancelar</button><button class="btn btn-primary" onclick="APP.enterAsSeller()">Entrar</button></div>'
      + '</div></div></div>';
    var i=el('f_vlogpin'); if(i) i.focus();
  }
  function enterAsSeller(){
    var id=el('f_vlogemp')?el('f_vlogemp').value:''; var pin=el('f_vlogpin')?el('f_vlogpin').value.trim():'';
    var e=S.empleados.find(function(x){return x.id===id;});
    if(e && pin && pin===String(e.pin)){
      vendSet(true); vendIdSet(e.id); S.vendedorMode=true; S.vendedorId=e.id; S.view='ventas'; el('modal-root').innerHTML=''; render(); toast('Turno iniciado: '+e.nombre,'info');
    } else { var er=el('vlog-error'); if(er){ er.textContent='PIN incorrecto para ese vendedor.'; er.style.display='block'; } }
  }
  function pinModal(){
    el('modal-root').innerHTML = '<div class="overlay"><div class="modal" style="max-width:360px"><div class="modal-head"><div class="modal-title">Salir de modo vendedor</div></div><div class="modal-body">'
      + '<div id="pin-error" class="form-error" style="display:none"></div>'
      + '<div class="tiny-muted" style="margin-bottom:12px">Escribe el PIN de administrador para volver a la vista completa.</div>'
      + '<div class="field"><input id="f_pinin" class="input num" type="password" inputmode="numeric" value="" placeholder="PIN" onkeydown="if(event.key===\'Enter\')APP.verificarPin()"></div>'
      + '<div class="modal-foot"><button class="btn btn-ghost" onclick="APP.closeModal(true)">Cancelar</button><button class="btn btn-primary" onclick="APP.verificarPin()">Entrar</button></div>'
      + '</div></div></div>';
    var i=el('f_pinin'); if(i) i.focus();
  }
  function salirVendedor(){ pinModal(); }
  function verificarPin(){
    var v=el('f_pinin')?el('f_pinin').value.trim():'';
    if(v && v===String(S.config.adminPin)){ vendSet(false); vendIdSet(''); S.vendedorMode=false; S.vendedorId=null; el('modal-root').innerHTML=''; render(); }
    else { var e=el('pin-error'); if(e){ e.textContent='PIN incorrecto.'; e.style.display='block'; } }
  }

  function nav(v){ S.view=v; S.q=''; S.catFilter=''; S.cliQ=''; S.ventQ=''; render(); }
  function invSearch(v){ S.q=v; var list=el('inv-list'); if(list) list.innerHTML=invRows(); }
  function cliSearch(v){ S.cliQ=v; var list=el('cli-list'); if(list) list.innerHTML=cliRows(); }
  function ventSearch(v){ S.ventQ=v; var list=el('vent-list'); if(list) list.innerHTML=ventRows(); }
  function catFilterSet(v){ S.catFilter=v; var list=el('inv-list'); if(list) list.innerHTML=invRows(); }
  function f(k,v){ S[k]=v; }

  window.APP = {
    nav:nav, invSearch:invSearch, cliSearch:cliSearch, ventSearch:ventSearch, catFilterSet:catFilterSet, f:f,
    openModal:openModal, closeModal:closeModal, save:save, openConteo:openConteo,
    ventaChanged:ventaChanged, restockRecalc:restockRecalc, setVentaTipo:setVentaTipo, ncfSel:ncfSel,
    addToCart:addToCart, removeCartLine:removeCartLine, descRecalc:descRecalc, setDescMode:setDescMode, autorizarDesc:autorizarDesc, addPromoGratis:addPromoGratis,
    conteoRecalc:conteoRecalc, guardarConteo:guardarConteo,
    printFactura:printFactura, printResultados:printResultados, printBalance:printBalance, printVolante:printVolante, printResumen:printResumen, printFlujo:printFlujo, printCambios:printCambios, printComparativa:printComparativa, printRentabilidad:printRentabilidad, rentPeriodoSet:rentPeriodoSet, printEstadoCuenta:printEstadoCuenta, cierreCalc:cierreCalc, cierreFechaSet:cierreFechaSet, printCierre:printCierre, removeFactura:removeFactura,
    exportInventario:exportInventario, exportVentas:exportVentas, exportClientes:exportClientes, exportGastos:exportGastos, exportCompras:exportCompras, exportBackup:exportBackup, export607:export607, export606:export606,
    removeCosto:removeCosto, removeGasto:removeGasto, removeProduct:removeProduct, removeCliente:removeCliente, removeAbono:removeAbono, removeCapital:removeCapital, removeEmpleado:removeEmpleado, removeProveedor:removeProveedor, pagoChanged:pagoChanged, renderPagoBreakdown:renderPagoBreakdown, regRegalia:regRegalia, liquidarCalc:liquidarCalc, liqEmpChanged:liqEmpChanged, printLiquidacion:printLiquidacion,
    confirmYes:confirmYes,
    finTabSet:function(t){ S.finTab=t; render(); },
    finPeriodoSet:function(p){ S.finPeriodo=p; render(); },
    login:login, signup:signup, logout:logout, enterVendedor:enterVendedor, enterAsSeller:enterAsSeller, salirVendedor:salirVendedor, verificarPin:verificarPin, toggleDark:toggleDark, logoUpload:logoUpload, logoQuitar:logoQuitar, onboardSave:onboardSave, openAdmin:openAdmin, activarSub:activarSub, suspenderSub:suspenderSub, doInstall:doInstall, dismissInstall:dismissInstall, desPeriodoSet:desPeriodoSet, printDesempeno:printDesempeno, setAuthMode:function(m){ S.authMode=m; S.authError=''; S.authMsg=''; render(); }
  };

  // ---------- init ----------
  S.vendedorMode = vendGet();
  S.vendedorId = vendGet() ? (vendIdGet()||null) : null;
  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferredPrompt=e; });
  window.addEventListener('appinstalled', function(){ deferredPrompt=null; var b=el('install-banner'); if(b) b.parentNode.removeChild(b); });
  applyDark();
  installBanner();
  setTimeout(function(){ S.splashDone=true; render(); }, 2500);
  sb.auth.onAuthStateChange(function(event, sess){
    S.session=sess; S.authReady=true;
    if(event==='INITIAL_SESSION' || event==='SIGNED_IN'){
      if(sess){ if(!S.loaded){ render(); loadAll(); } else { render(); } } else { render(); }
    } else if(event==='SIGNED_OUT'){
      S.loaded=false; S.products=[]; S.sales=[]; S.costos=[]; S.gastos=[]; S.clientes=[]; S.abonos=[]; S.facturas=[]; S.conteos=[]; S.capital=[]; S.empleados=[]; S.ncfSeqs=[]; S.proveedores=[]; S.pagosProveedor=[]; S.suscripcion=null; S.configExists=false; render();
    } else { render(); }
  });
  sb.auth.getSession().then(function(r){
    if(!S.authReady){ S.session=r.data.session; S.authReady=true; if(S.session){ render(); loadAll(); } else { render(); } }
  });
})();
</script>
